Actual issue
Android sync ke structure-pack apply stage par ye query fail ho rahi hai:

INSERT INTO node_open_state (node_id, last_opened_at)
Desktop se ek purana node_open_state record aa raha hai, lekin uska related node_id Android database ke nodes table me nahi mil raha. Foreign-key constraint ki wajah se poora sync transaction rollback ho jaata hai. Isliye:

group create/join ho raha hai
sync start hota hai
files/content download stage tak pahunchne se pehle fail ho jaata hai
app baar-baar sync try karta hua dikhta hai
node_open_state sirf “last opened time” metadata hai; actual content ke liye essential nahi hai.

Code fix
Maine sync apply logic me guard laga diya hai:

pehle check hoga ki node locally exist karta hai ya nahi
missing/orphan node_open_state ko skip kiya jayega
baaki nodes, text aur files sync hote rahenge
valid open-state records normally apply honge
Regression test 8/8 pass hua. Desktop aur Android type-checks bhi pass hain.

