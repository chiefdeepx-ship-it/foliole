build-foliole-windows-github-action-fixed.yml
name: Build Foliole Windows (latest dev + sync fixes)
​
on:
  workflow_dispatch:
​
permissions:
  contents: read
​
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_msvs_version: "2022"
      GYP_MSVS_VERSION: "2022"
    steps:
      - name: Check out exact matching upstream revision
        uses: actions/checkout@v4
        with:
          repository: campfirium/foliole
          ref: 50a1313da97042ebaf8116df2aa4434b882143fa
          fetch-depth: 1
          persist-credentials: false
​
      - name: Apply verified Android and desktop sync fixes
        shell: pwsh
        run: |
          $encoded = @'
          
          '@
          $patchPath = Join-Path $env:RUNNER_TEMP 'foliole-syncfix.patch'
          [IO.File]::WriteAllBytes($patchPath, [Convert]::FromBase64String(($encoded -replace '\s', '')))
          git apply --check $patchPath
          git apply $patchPath
​
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
​
      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"
​
      - name: Locate Visual Studio C++ toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio 2022 C++ tools were not found on the runner." }
          "GYP_MSVS_OVERRIDE_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Visual Studio: $vsPath"
​
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
​
      - name: Install dependencies
        run: npm ci
​
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
​
      - name: Run focused sync regression tests
        run: >-
          npx vitest run --silent=passed-only --pool=threads --maxWorkers=2 --no-file-parallelism
          electron/sync/syncPackSyncObjectsExecutor.test.ts
          src/shared/platform/companion/runtime/capacitorCompanionDatabaseOwner.test.ts
          src/features/settings/components/sections/SettingsSyncGroupDeviceRow.test.tsx
​
      - name: Build unsigned Windows installer
        run: npm run windows:package
​
      - name: Write installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/windows -Filter 'Foliole-Windows-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content artifacts/windows/SHA256SUMS.txt -Encoding ascii
​
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Foliole-Windows-50a1313-syncfix
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.blockmap
            artifacts/windows/latest.yml
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
​
