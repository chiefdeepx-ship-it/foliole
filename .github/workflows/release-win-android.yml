name: Build and Release Windows EXE & Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional custom release tag (leave blank for auto tag based on commit)'
        required: false
        default: ''
  push:
    branches:
      - preview

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate

      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Build Windows .exe installer
        run: npm run build:windows

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foliole-windows-exe
          path: artifacts/windows/*.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21.0.13+1'
          check-latest: true

      - name: Install Linux DNS-SD build headers
        run: sudo apt-get update && sudo apt-get install -y libavahi-client-dev

      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs

      - name: Install Android SDK 36 & SQLCipher NDK toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"

      - name: Build Android Debug APK
        env:
          FOLIOLE_DEV_LIVE_RELOAD: ""
          FOLIOLE_ANDROID_ACCEPTANCE_APPLICATION_ID: ""
          FOLIOLE_ANDROID_COMPANION_SYNC_PORT: ""
        run: npm run build:android

      - name: Rename APK with version and commit SHA
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Foliole-Android-${VERSION}-${SHORT_SHA}.apk"

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foliole-android-apk
          path: android/app/build/outputs/apk/debug/Foliole-Android-*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Create GitHub Release (.exe + .apk)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Release Tag and Metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${VERSION}-preview-${SHORT_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=Foliole ${VERSION} (${SHORT_SHA}) - Windows & Android" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            Automated build from branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).
            - **Windows Installer (`.exe`)**: Download `Foliole-Windows-x64-*.exe`
            - **Android App (`.apk`)**: Download `Foliole-Android-*.apk`
          files: |
            release-assets/*.exe
            release-assets/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
